name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test
        run: swift test
      - name: Test CLI and stdio protocol
        run: python3 scripts/smoke-test.py "$(swift build --show-bin-path)/DevBar"
      - name: Build and verify universal release packages
        run: scripts/package-release.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-universal
          path: dist/*
          if-no-files-found: error
